; FD Commander PHP configuration
upload_max_filesize = 30M
post_max_size = 35M
memory_limit = 256M
max_execution_time = 60

; Session cookie hardening. Laravel manages its own session cookie via
; config/session.php; these apply to any raw PHP session as defense in depth.
; cookie_secure is intentionally left unset so plain-HTTP LAN/field deployments
; keep working -- set SESSION_SECURE_COOKIE=true when serving over TLS.
session.cookie_httponly = 1
session.use_strict_mode = 1
session.cookie_samesite = "Lax"

; Do not advertise the PHP version in X-Powered-By.
expose_php = Off
