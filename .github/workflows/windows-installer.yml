# Builds the Windows server installer for a release tag on main and attaches
# it to that tag's GitHub release. If the release doesn't exist yet, it makes
# a draft with the tag's CHANGELOG.md notes, to title and publish by hand.
#
# Actions are pinned to commit SHAs; the comment names the release.
name: Windows installer

on:
  push:
    tags: ['v*']

# Each job grants only what it needs.
permissions: {}

concurrency:
  group: windows-installer-${{ github.ref }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      # A tag on any other branch never publishes, so push main first.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check the tag is on main and matches VERSION
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME is not on main"
            exit 1
          fi
          version=$(tr -d '[:space:]' < VERSION)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::VERSION says $version but the tag is $GITHUB_REF_NAME"
            exit 1
          fi

      - name: Install NSIS
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends nsis

      - name: Build the installer
        run: windows/build-installer.sh

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-installer
          path: dist/field-day-commander-server-setup-*.exe
          if-no-files-found: error

  attach:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-installer
          path: release

      - name: Add the checksum
        run: cd release && sha256sum -- *.exe > field-day-commander-server-setup.sha256

      - name: Attach to the release, or make a draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release/* --repo "$GITHUB_REPOSITORY" --clobber
            exit 0
          fi

          version=${GITHUB_REF_NAME#v}
          awk -v heading="## $version " 'index($0, heading) == 1 { found = 1; next } found && /^## / { exit } found' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "Release notes to come." > notes.md
          fi
          gh release create "$GITHUB_REF_NAME" release/* --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
            --title "Field Day Commander $version" --notes-file notes.md
