version = 1
SPDX-PackageName = "FD Commander website"
SPDX-PackageSupplier = "Corey Koval <ckoval7@gmail.com>"
SPDX-PackageDownloadLocation = "https://github.com/ckoval7/fielddaycommander"

# The site's JavaScript and CSS carry their own SPDX headers. This file covers
# everything else. When several annotations match a file, the last one wins.

# Default: the app snapshot this branch still carries from main, and tooling.
[[annotations]]
path = "**"
SPDX-FileCopyrightText = "2026 Corey Koval <ckoval7@gmail.com>"
SPDX-License-Identifier = "GPL-3.0-or-later"

# Creative works: the website, images, and documentation.
[[annotations]]
path = [
    "docs/**",
    "public/favicon.ico",
    "public/favicon.png",
    "README.md",
    "DOCKER.md",
]
SPDX-FileCopyrightText = "2026 Corey Koval <ckoval7@gmail.com>"
SPDX-License-Identifier = "CC-BY-NC-SA-4.0"

# Files that started from the MIT-licensed Laravel application skeleton and
# first-party Laravel packages, and CLAUDE.md, which embeds the MIT-licensed
# Laravel Boost guidelines.
