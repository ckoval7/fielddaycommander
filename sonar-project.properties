sonar.projectKey=ckoval7_fd-commander
sonar.organization=ckoval7
sonar.sources=.
sonar.tests=tests
sonar.host.url=https://sonarcloud.io

sonar.exclusions=node_modules/**,vendor/**,storage/**,bootstrap/cache/**,tests/**,.env,.env.*
sonar.test.inclusions=tests/**/*.php
sonar.php.coverage.reportPaths=coverage.xml

# Exclude structural duplication (config arrays, factory states, seeders, migrations, form request validation rules, frozen rule-set data)
sonar.cpd.exclusions=config/**/*.php,database/factories/**/*.php,database/seeders/**/*.php,database/migrations/**/*.php,app/Http/Requests/**/*.php,app/Scoring/Rules/**/*.php

# Suppress false positives
# php:S1848 - Volt/Livewire component syntax (new class extends Component) is valid
sonar.issue.ignore.multicriteria=e1,e2,e3,e4,e5,e6,e7,e8,e9,e10,e11,e12,e13,e14,e15,e16,e17,e18,e19,e20,e21,e22,e23,e24,e25,e26,e27,e28,e29,e30,e31,e32,e33,e34,e35,e36,e37,e38,e39,e40,e41,e42,e43,e44,e45,e46,e47,e48,e49,e50,e51,e52
sonar.issue.ignore.multicriteria.e1.ruleKey=php:S1848
sonar.issue.ignore.multicriteria.e1.resourceKey=resources/views/**/*.blade.php
# css:S4662 - Tailwind CSS v4 @plugin, @source, @custom-variant are valid directives
sonar.issue.ignore.multicriteria.e2.ruleKey=css:S4662
sonar.issue.ignore.multicriteria.e2.resourceKey=resources/css/**/*.css
# Web:S6851 - Alt text is clean but SonarQube flags Blade variable names ($image, $photo*)
sonar.issue.ignore.multicriteria.e3.ruleKey=Web:S6851
sonar.issue.ignore.multicriteria.e3.resourceKey=resources/views/**/*.blade.php
# php:S116 - Livewire component properties use snake_case to match wire:model bindings in Blade templates
sonar.issue.ignore.multicriteria.e4.ruleKey=php:S116
sonar.issue.ignore.multicriteria.e4.resourceKey=app/Livewire/**/*.php
# Web:S6819 - Chart widget uses ARIA roles on divs intentionally for accessible data table alongside canvas
sonar.issue.ignore.multicriteria.e5.ruleKey=Web:S6819
sonar.issue.ignore.multicriteria.e5.resourceKey=resources/views/livewire/dashboard/widgets/chart.blade.php
# php:S1172 - Policy method params are required by Laravel's authorization contract even when unused in method body
sonar.issue.ignore.multicriteria.e6.ruleKey=php:S1172
sonar.issue.ignore.multicriteria.e6.resourceKey=app/Policies/**/*.php
# php:S1172 - Broadcast channel closures require $user and route params per Laravel's channel auth contract
sonar.issue.ignore.multicriteria.e7.ruleKey=php:S1172
sonar.issue.ignore.multicriteria.e7.resourceKey=routes/channels.php
# php:S1172 - Factory state closures receive $attributes per Laravel's factory contract
sonar.issue.ignore.multicriteria.e8.ruleKey=php:S1172
sonar.issue.ignore.multicriteria.e8.resourceKey=database/factories/**/*.php
# php:S1172 - Validation closure params ($attribute, $value, $fail) are required by Laravel's custom rule contract
sonar.issue.ignore.multicriteria.e9.ruleKey=php:S1172
sonar.issue.ignore.multicriteria.e9.resourceKey=app/Livewire/**/*.php
# php:S1172 - suggestPresenceType keeps coordinate params for API consistency (documented in PHPDoc)
sonar.issue.ignore.multicriteria.e10.ruleKey=php:S1172
sonar.issue.ignore.multicriteria.e10.resourceKey=app/Services/LocationDetectionService.php
# php:S1448 - Livewire components inherently have many methods (actions, computed props, lifecycle hooks)
sonar.issue.ignore.multicriteria.e11.ruleKey=php:S1448
sonar.issue.ignore.multicriteria.e11.resourceKey=app/Livewire/**/*.php
# Web:S6819 - Draggable equipment items use div+role="button" because draggable elements must be divs
sonar.issue.ignore.multicriteria.e12.ruleKey=Web:S6819
sonar.issue.ignore.multicriteria.e12.resourceKey=resources/views/livewire/stations/equipment-assignment.blade.php
# php:S1192 - Config files use intentionally repeated default values per Laravel convention
sonar.issue.ignore.multicriteria.e13.ruleKey=php:S1192
sonar.issue.ignore.multicriteria.e13.resourceKey=config/**/*.php
# php:S1172 - Observer method params are required by Laravel's model observer contract
sonar.issue.ignore.multicriteria.e14.ruleKey=php:S1172
sonar.issue.ignore.multicriteria.e14.resourceKey=app/Observers/**/*.php
# php:S1172 - Middleware handle() params ($response) are required by Laravel's middleware contract
sonar.issue.ignore.multicriteria.e15.ruleKey=php:S1172
sonar.issue.ignore.multicriteria.e15.resourceKey=app/Http/Middleware/**/*.php
# php:S1172 - Bootstrap app.php closure params ($exceptions) are required by Laravel's configuration contract
sonar.issue.ignore.multicriteria.e16.ruleKey=php:S1172
sonar.issue.ignore.multicriteria.e16.resourceKey=bootstrap/app.php
# php:S3358 - Config files use nested ternaries per Laravel defaults
sonar.issue.ignore.multicriteria.e17.ruleKey=php:S3358
sonar.issue.ignore.multicriteria.e17.resourceKey=config/**/*.php
# Web:S6845/S6848 - Draggable equipment divs need tabindex for keyboard accessibility but must remain divs
sonar.issue.ignore.multicriteria.e18.ruleKey=Web:S6845
sonar.issue.ignore.multicriteria.e18.resourceKey=resources/views/livewire/stations/equipment-assignment.blade.php
sonar.issue.ignore.multicriteria.e19.ruleKey=Web:S6848
sonar.issue.ignore.multicriteria.e19.resourceKey=resources/views/livewire/stations/equipment-assignment.blade.php
# Web:MouseEventWithoutKeyboardEquivalentCheck - Alpine @keydown not recognized by SonarQube
sonar.issue.ignore.multicriteria.e20.ruleKey=Web:MouseEventWithoutKeyboardEquivalentCheck
sonar.issue.ignore.multicriteria.e20.resourceKey=resources/views/livewire/stations/equipment-assignment.blade.php
# php:S1142 - Guard clause pattern (early returns for validation) is idiomatic PHP
sonar.issue.ignore.multicriteria.e21.ruleKey=php:S1142
sonar.issue.ignore.multicriteria.e21.resourceKey=app/Services/**/*.php
sonar.issue.ignore.multicriteria.e22.ruleKey=php:S1142
sonar.issue.ignore.multicriteria.e22.resourceKey=app/Http/**/*.php
sonar.issue.ignore.multicriteria.e23.ruleKey=php:S1142
sonar.issue.ignore.multicriteria.e23.resourceKey=app/Livewire/**/*.php
# php:S1448 - Laravel Eloquent models require many methods for relationships, accessors, and scopes
sonar.issue.ignore.multicriteria.e24.ruleKey=php:S1448
sonar.issue.ignore.multicriteria.e24.resourceKey=app/Models/**/*.php
# php:S138 - Seeder data-definition methods are long by nature (array of records)
sonar.issue.ignore.multicriteria.e25.ruleKey=php:S138
sonar.issue.ignore.multicriteria.e25.resourceKey=database/seeders/**/*.php
# php:S1135 - TODO comments are tracked in issue tracker, not enforced by static analysis
sonar.issue.ignore.multicriteria.e26.ruleKey=php:S1135
sonar.issue.ignore.multicriteria.e26.resourceKey=**/*.php
# php:S4833/S2003 - FrankenPHP worker uses require per Octane convention, not autoloaded code
sonar.issue.ignore.multicriteria.e27.ruleKey=php:S4833
sonar.issue.ignore.multicriteria.e27.resourceKey=public/frankenphp-worker.php
sonar.issue.ignore.multicriteria.e28.ruleKey=php:S2003
sonar.issue.ignore.multicriteria.e28.resourceKey=public/frankenphp-worker.php
# Web:S6845 - DaisyUI dropdown-content divs require tabindex="0" for keyboard-accessible dropdowns
sonar.issue.ignore.multicriteria.e29.ruleKey=Web:S6845
sonar.issue.ignore.multicriteria.e29.resourceKey=resources/views/livewire/logging/logging-interface.blade.php
# Web:S5256 - PDF submission sheet table uses hidden headers that become visible in generated PDF; headerless table is intentional
sonar.issue.ignore.multicriteria.e30.ruleKey=Web:S5256
sonar.issue.ignore.multicriteria.e30.resourceKey=resources/views/reports/submission-sheet-pdf.blade.php
# shelldre:S7682 - Shell deploy/update scripts don't need explicit return statements in every function
sonar.issue.ignore.multicriteria.e31.ruleKey=shelldre:S7682
sonar.issue.ignore.multicriteria.e31.resourceKey=*.sh
# shelldre:S7679 - Positional params in shell scripts are idiomatic for deploy/update helpers
sonar.issue.ignore.multicriteria.e32.ruleKey=shelldre:S7679
sonar.issue.ignore.multicriteria.e32.resourceKey=*.sh
# shelldre:S7677 - Error messages in deploy/update scripts go to stdout intentionally for log capture
sonar.issue.ignore.multicriteria.e33.ruleKey=shelldre:S7677
sonar.issue.ignore.multicriteria.e33.resourceKey=*.sh
# shelldre:S131 - Deploy script case statements handle known values; default not needed
sonar.issue.ignore.multicriteria.e34.ruleKey=shelldre:S131
sonar.issue.ignore.multicriteria.e34.resourceKey=*.sh

# Web:PageWithoutTitleCheck / Web:S5254 - Blade layouts set <title> and <html lang>
# via Blade expressions the HTML parser cannot resolve; both are present.
sonar.issue.ignore.multicriteria.e35.ruleKey=Web:PageWithoutTitleCheck
sonar.issue.ignore.multicriteria.e35.resourceKey=resources/views/components/layouts/*.blade.php
sonar.issue.ignore.multicriteria.e36.ruleKey=Web:S5254
sonar.issue.ignore.multicriteria.e36.resourceKey=resources/views/components/layouts/*.blade.php
# php:S4790 - md5 in AdifContactMapper is a dedup key persisted to contacts.external_id,
# not a security primitive; changing it would orphan already-imported contacts.
sonar.issue.ignore.multicriteria.e37.ruleKey=php:S4790
sonar.issue.ignore.multicriteria.e37.resourceKey=app/Services/AdifContactMapper.php
# php:S2245 - DeveloperTools seeds fake QSO sample data behind the manage-settings gate; no security context.
sonar.issue.ignore.multicriteria.e38.ruleKey=php:S2245
sonar.issue.ignore.multicriteria.e38.resourceKey=app/Livewire/Admin/DeveloperTools.php
# php:S112 - RuntimeException is the right type for a boot-time config assertion.
sonar.issue.ignore.multicriteria.e39.ruleKey=php:S112
sonar.issue.ignore.multicriteria.e39.resourceKey=app/Providers/FortifyServiceProvider.php
# php:S1192 - Applied migrations are frozen historical records; extracting constants changes nothing at runtime.
sonar.issue.ignore.multicriteria.e40.ruleKey=php:S1192
sonar.issue.ignore.multicriteria.e40.resourceKey=database/migrations/**/*.php
# php:S1172 - handleRadioInfo keeps $config so all handleX() methods share one (dto, config) signature.
sonar.issue.ignore.multicriteria.e41.ruleKey=php:S1172
sonar.issue.ignore.multicriteria.e41.resourceKey=app/Services/ExternalContactHandler.php
# docker:S6470 - .dockerignore excludes .env, .git, and other secrets from the COPY . . context.
sonar.issue.ignore.multicriteria.e42.ruleKey=docker:S6470
sonar.issue.ignore.multicriteria.e42.resourceKey=Dockerfile
# php:S5332 - CORS http:// entries are Vite dev-server origins on localhost; supports_credentials is false.
sonar.issue.ignore.multicriteria.e43.ruleKey=php:S5332
sonar.issue.ignore.multicriteria.e43.resourceKey=config/cors.php
# php:S1313 - Dotted numerals in rule sets are ARRL rulebook section numbers (7.3.12), not IP addresses.
sonar.issue.ignore.multicriteria.e44.ruleKey=php:S1313
sonar.issue.ignore.multicriteria.e44.resourceKey=app/Scoring/Rules/**/*.php
# php:S1142 - Guard clause pattern (early returns for validation) is idiomatic PHP
sonar.issue.ignore.multicriteria.e45.ruleKey=php:S1142
sonar.issue.ignore.multicriteria.e45.resourceKey=app/Models/**/*.php
# Web:S5256/S5257 - The summary-grid is a layout table, not a data table. Reports render
# through DomPDF, which supports neither flexbox nor grid, so a table is the only option.
sonar.issue.ignore.multicriteria.e46.ruleKey=Web:S5256
sonar.issue.ignore.multicriteria.e46.resourceKey=resources/views/equipment/reports/*.blade.php
sonar.issue.ignore.multicriteria.e47.ruleKey=Web:S5257
sonar.issue.ignore.multicriteria.e47.resourceKey=resources/views/equipment/reports/*.blade.php
# php:S2092 - session.cookie_secure is deliberately unset: FD Commander supports plain-HTTP
# LAN/field deployments. Operators serving over TLS set SESSION_SECURE_COOKIE=true (.env.example).
sonar.issue.ignore.multicriteria.e48.ruleKey=php:S2092
sonar.issue.ignore.multicriteria.e48.resourceKey=docker/php.ini
# php:S1448 - RuleSet implementations expose one method per rulebook concept because the
# RuleSet interface requires them; splitting the class would break the contract.
sonar.issue.ignore.multicriteria.e49.ruleKey=php:S1448
sonar.issue.ignore.multicriteria.e49.resourceKey=app/Scoring/Rules/**/*.php
# Web:S9379 - The exchange input is the sole purpose of the logging/transcribe screens; operators
# start typing contacts immediately, so autofocus is the expected, accessible behavior here.
sonar.issue.ignore.multicriteria.e50.ruleKey=Web:S9379
sonar.issue.ignore.multicriteria.e50.resourceKey=resources/views/livewire/logging/logging-interface.blade.php
sonar.issue.ignore.multicriteria.e51.ruleKey=Web:S9379
sonar.issue.ignore.multicriteria.e51.resourceKey=resources/views/livewire/logging/transcribe-interface.blade.php
# Web:MouseEventWithoutKeyboardEquivalentCheck - Section map SVG pointer handlers only drive hover
# tooltips; the worked/total counts are rendered as text above the map. Escape clears a pinned tooltip.
sonar.issue.ignore.multicriteria.e52.ruleKey=Web:MouseEventWithoutKeyboardEquivalentCheck
sonar.issue.ignore.multicriteria.e52.resourceKey=resources/views/livewire/section-map.blade.php
