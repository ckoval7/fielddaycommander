{{- if .Values.ingress.enabled }}
{{- $fullName := include "fd-commander.fullname" . }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $fullName }}
  labels:
    {{- include "fd-commander.labels" . | nindent 4 }}
  {{- if or .Values.ingress.maxBodySize .Values.ingress.annotations }}
  annotations:
    {{- if .Values.ingress.maxBodySize }}
    # ingress-nginx rejects request bodies over 1m by default, which blocks
    # photo uploads. Other controllers ignore this annotation.
    nginx.ingress.kubernetes.io/proxy-body-size: {{ .Values.ingress.maxBodySize | quote }}
    {{- end }}
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.ingress.host | quote }}
      secretName: {{ .Values.ingress.tls.secretName | default (printf "%s-tls" $fullName) }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          {{- if .Values.reverb.enabled }}
          # Reverb's WebSocket endpoint. Listed first so it wins over the
          # catch-all path below, mirroring the container's Caddyfile.
          - path: /app
            pathType: Prefix
            backend:
              service:
                name: {{ $fullName }}
                port:
                  name: reverb
          {{- end }}
          - path: {{ .Values.ingress.path }}
            pathType: {{ .Values.ingress.pathType }}
            backend:
              service:
                name: {{ $fullName }}
                port:
                  name: http
{{- end }}
