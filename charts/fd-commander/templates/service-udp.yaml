{{- if .Values.externalLoggers.enabled }}
{{- /*
Separate service for the external logger UDP listeners. Kept apart from the
web service so the UDP endpoints can use a different service type — a plain
ClusterIP is not reachable from the radio logging software on the LAN.
A blank node port lets Kubernetes pick a free one, so a second release in the
same cluster does not collide with the first one's fixed ports.
*/}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "fd-commander.fullname" . }}-udp
  labels:
    {{- include "fd-commander.labels" . | nindent 4 }}
  {{- with .Values.externalLoggers.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.externalLoggers.service.type }}
  {{- if and (eq .Values.externalLoggers.service.type "LoadBalancer") .Values.externalLoggers.service.loadBalancerIP }}
  loadBalancerIP: {{ .Values.externalLoggers.service.loadBalancerIP }}
  {{- end }}
  ports:
    {{- if .Values.externalLoggers.n1mm.enabled }}
    - port: {{ .Values.externalLoggers.n1mm.port }}
      targetPort: n1mm
      protocol: UDP
      name: n1mm
      {{- if eq .Values.externalLoggers.service.type "NodePort" }}
      {{- with dig "nodePorts" "n1mm" "" .Values.externalLoggers.service }}
      nodePort: {{ . }}
      {{- end }}
      {{- end }}
    {{- end }}
    {{- if .Values.externalLoggers.wsjtx.enabled }}
    - port: {{ .Values.externalLoggers.wsjtx.port }}
      targetPort: wsjtx
      protocol: UDP
      name: wsjtx
      {{- if eq .Values.externalLoggers.service.type "NodePort" }}
      {{- with dig "nodePorts" "wsjtx" "" .Values.externalLoggers.service }}
      nodePort: {{ . }}
      {{- end }}
      {{- end }}
    {{- end }}
    {{- if .Values.externalLoggers.udpAdif.enabled }}
    - port: {{ .Values.externalLoggers.udpAdif.port }}
      targetPort: udp-adif
      protocol: UDP
      name: udp-adif
      {{- if eq .Values.externalLoggers.service.type "NodePort" }}
      {{- with dig "nodePorts" "udpAdif" "" .Values.externalLoggers.service }}
      nodePort: {{ . }}
      {{- end }}
      {{- end }}
    {{- end }}
  selector:
    {{- include "fd-commander.selectorLabels" . | nindent 4 }}
{{- end }}
