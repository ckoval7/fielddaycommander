apiVersion: v1
kind: Service
metadata:
  name: {{ include "fd-commander.fullname" . }}
  labels:
    {{- include "fd-commander.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
      {{- if and (eq .Values.service.type "NodePort") .Values.service.nodePort }}
      nodePort: {{ .Values.service.nodePort }}
      {{- end }}
    {{- if .Values.reverb.enabled }}
    - port: {{ .Values.reverb.port }}
      targetPort: reverb
      protocol: TCP
      name: reverb
    {{- end }}
  selector:
    {{- include "fd-commander.selectorLabels" . | nindent 4 }}
