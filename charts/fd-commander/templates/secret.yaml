{{- if not .Values.existingSecret }}
{{- $fullName := include "fd-commander.fullname" . }}
{{- /*
APP_KEY and the Reverb credentials are generated once and reused on every
upgrade (see fd-commander.credentials): a new APP_KEY would make every
encrypted column and session unreadable.
*/}}
{{- include "fd-commander.credentials" . }}
{{- $credentials := .Values._fdcCredentials }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $fullName }}
  labels:
    {{- include "fd-commander.labels" . | nindent 4 }}
  annotations:
    # Kept on uninstall along with the data volumes, so reinstalling under the
    # same release name still decrypts the old data. See the chart README.
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  APP_KEY: {{ $credentials.appKey | quote }}
  {{- /*
  Database and Redis passwords are only stored here when pointing at an
  external server. The bundled MySQL and Redis keep theirs in the
  <release>-mysql and <release>-redis secrets, which both the database pod
  and the app read, so a generated password cannot drift between the two.
  */}}
  {{- if not .Values.mysql.enabled }}
  DB_PASSWORD: {{ .Values.externalDatabase.password | quote }}
  {{- end }}
  {{- if and (not .Values.redis.enabled) .Values.externalRedis.host .Values.externalRedis.password }}
  REDIS_PASSWORD: {{ .Values.externalRedis.password | quote }}
  {{- end }}
  REVERB_APP_KEY: {{ $credentials.reverbKey | quote }}
  REVERB_APP_SECRET: {{ $credentials.reverbSecret | quote }}
  REVERB_APP_ID: {{ $credentials.reverbId | quote }}
  {{- if .Values.mail.password }}
  MAIL_PASSWORD: {{ .Values.mail.password | quote }}
  {{- end }}
{{- end }}
