apiVersion: v2
name: fd-commander
description: Field Day Commander — Amateur Radio Field Day logging and scoring
type: application
version: 0.1.0
appVersion: "26.10.2"
home: https://github.com/ckoval7/fielddaycommander
sources:
  - https://github.com/ckoval7/fielddaycommander
keywords:
  - amateur-radio
  - ham-radio
  - field-day
  - logging
  - laravel
maintainers:
  - name: Corey Koval
annotations:
  catalog.cattle.io/certified: partner
  catalog.cattle.io/display-name: Field Day Commander
  catalog.cattle.io/release-name: fd-commander
  catalog.cattle.io/namespace: fd-commander
  catalog.cattle.io/type: cluster-tool
  catalog.cattle.io/kube-version: ">=1.24.0-0"
dependencies:
  - name: mysql
    version: "12.x.x"
    repository: https://charts.bitnami.com/bitnami
    condition: mysql.enabled
  - name: redis
    version: "20.x.x"
    repository: https://charts.bitnami.com/bitnami
    condition: redis.enabled
