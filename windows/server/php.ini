; PHP settings for the Windows server, shared by frankenphp.exe and php.exe.
; setup.ps1 fills in @EXTENSION_DIR@ with the install's full path, since a
; relative extension_dir depends on the folder PHP was started from.
; The other values match docker/php.ini.

extension_dir = "@EXTENSION_DIR@"

; The official PHP for Windows build ships these as DLLs.
extension=curl
extension=fileinfo
extension=gd
extension=intl
extension=mbstring
extension=openssl
extension=pdo_sqlite
extension=sockets
extension=sqlite3
extension=zip

; OPcache is built into PHP 8.5.
opcache.enable=1
opcache.enable_cli=0

memory_limit = 256M
upload_max_filesize = 30M
post_max_size = 35M
max_execution_time = 60
date.timezone = UTC

session.cookie_httponly = 1
session.use_strict_mode = 1
session.cookie_samesite = "Lax"
session.upload_progress.enabled = Off
expose_php = Off
